# Auralis 360 stage: sits between EasyEffects and whatever the default
# hardware output is (no device is hardcoded; it follows the default sink).
#
# Headphone mode: stereo in -> binaural out using the MIT KEMAR HRTF.
# Front L/R are placed as virtual speakers at +/-30 degrees; a delayed,
# quieter copy of each channel is placed behind/beside the listener
# (+/-115 degrees) to give an enveloping, out-of-head image.
# Speaker mode: plain passthrough (mixer input 5).
#
# ~/.local/bin/auralis switches between the two at runtime by setting the
# mixer gains; the values below (passthrough) are just the startup state.
#
# @SOFA_FILE@ is replaced with the HRTF file path by install.sh.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Auralis 360"
            media.name       = "Auralis 360"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyL }
                    { type = builtin label = copy name = copyR }
                    {
                        type = sofa label = spatializer name = spFL
                        config  = { filename = "@SOFA_FILE@" }
                        control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.4 }
                    }
                    {
                        type = sofa label = spatializer name = spFR
                        config  = { filename = "@SOFA_FILE@" }
                        control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.4 }
                    }
                    {
                        type = builtin label = delay name = delL
                        config  = { "max-delay" = 1 }
                        control = { "Delay (s)" = 0.012 }
                    }
                    {
                        type = builtin label = delay name = delR
                        config  = { "max-delay" = 1 }
                        control = { "Delay (s)" = 0.012 }
                    }
                    {
                        type = sofa label = spatializer name = spRL
                        config  = { filename = "@SOFA_FILE@" }
                        control = { "Azimuth" = 115.0 "Elevation" = 0.0 "Radius" = 1.4 }
                    }
                    {
                        type = sofa label = spatializer name = spRR
                        config  = { filename = "@SOFA_FILE@" }
                        control = { "Azimuth" = 245.0 "Elevation" = 0.0 "Radius" = 1.4 }
                    }
                    {
                        type = builtin label = mixer name = mixL
                        control = { "Gain 1" = 0.0 "Gain 2" = 0.0 "Gain 3" = 0.0 "Gain 4" = 0.0 "Gain 5" = 1.0 }
                    }
                    {
                        type = builtin label = mixer name = mixR
                        control = { "Gain 1" = 0.0 "Gain 2" = 0.0 "Gain 3" = 0.0 "Gain 4" = 0.0 "Gain 5" = 1.0 }
                    }
                ]
                links = [
                    { output = "copyL:Out" input = "spFL:In" }
                    { output = "copyR:Out" input = "spFR:In" }
                    { output = "copyL:Out" input = "delL:In" }
                    { output = "copyR:Out" input = "delR:In" }
                    { output = "delL:Out"  input = "spRL:In" }
                    { output = "delR:Out"  input = "spRR:In" }

                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spRL:Out L" input = "mixL:In 3" }
                    { output = "spRR:Out L" input = "mixL:In 4" }

                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                    { output = "spRL:Out R" input = "mixR:In 3" }
                    { output = "spRR:Out R" input = "mixR:In 4" }

                    { output = "copyL:Out" input = "mixL:In 5" }
                    { output = "copyR:Out" input = "mixR:In 5" }
                ]
                inputs  = [ "copyL:In" "copyR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "effect_input.auralis-360"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "effect_output.auralis-360"
                node.passive   = true
                node.dont-move = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
